<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <title id="t">Per-person beauty filter</title>
  <desc id="d">Two cartoon faces in one camera frame. Person 1 has the beauty filter on (smoother, brighter skin, slimmer jaw, larger eyes). Person 2 has it switched off and stays exactly as captured.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffe9dc"/>
      <stop offset="1" stop-color="#f6c9b0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="300" rx="18" fill="#1d2026"/>
  <rect x="12" y="12" width="616" height="276" rx="12" fill="#2a2f38"/>

  <!-- Person 1: beauty ON -->
  <g transform="translate(170 165)">
    <rect x="-95" y="-110" width="190" height="215" rx="10" fill="none" stroke="#3ddc84" stroke-width="3"/>
    <rect x="-95" y="-142" width="190" height="28" rx="14" fill="#3ddc84"/>
    <text x="0" y="-123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0d2b18">Person 1 · beauty ON</text>
    <path d="M-62 -40 C-62 -95 62 -95 62 -40 L56 20 C48 62 18 82 0 82 C-18 82 -48 62 -56 20 Z" fill="url(#glow)"/>
    <ellipse cx="-24" cy="-22" rx="13" ry="15" fill="#fff"/>
    <ellipse cx="24" cy="-22" rx="13" ry="15" fill="#fff"/>
    <circle cx="-24" cy="-20" r="8" fill="#3a2a22"/>
    <circle cx="24" cy="-20" r="8" fill="#3a2a22"/>
    <circle cx="-21" cy="-23" r="2.5" fill="#fff"/>
    <circle cx="27" cy="-23" r="2.5" fill="#fff"/>
    <path d="M-16 34 Q0 46 16 34" fill="none" stroke="#b5544a" stroke-width="4" stroke-linecap="round"/>
    <path d="M-80 -70 l6 0 M-77 -73 l0 6 M78 -60 l8 0 M82 -64 l0 8 M70 50 l6 0 M73 47 l0 6" stroke="#fff6c2" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Person 2: beauty OFF -->
  <g transform="translate(450 165)">
    <rect x="-95" y="-110" width="190" height="215" rx="10" fill="none" stroke="#9aa1aa" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="-95" y="-142" width="190" height="28" rx="14" fill="#9aa1aa"/>
    <text x="0" y="-123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#22262c" text-decoration="line-through">Person 2 · beauty OFF</text>
    <path d="M-68 -40 C-68 -95 68 -95 68 -40 L64 24 C58 66 26 86 0 86 C-26 86 -58 66 -64 24 Z" fill="#e7b293"/>
    <circle cx="-38" cy="18" r="3" fill="#c98f70"/>
    <circle cx="30" cy="28" r="2.5" fill="#c98f70"/>
    <circle cx="42" cy="10" r="2" fill="#c98f70"/>
    <ellipse cx="-24" cy="-20" rx="10" ry="11" fill="#fff"/>
    <ellipse cx="24" cy="-20" rx="10" ry="11" fill="#fff"/>
    <circle cx="-24" cy="-19" r="6" fill="#3a2a22"/>
    <circle cx="24" cy="-19" r="6" fill="#3a2a22"/>
    <path d="M-16 38 Q0 46 16 38" fill="none" stroke="#a24d43" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
